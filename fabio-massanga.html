<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    (function () {
      var hash = (window.location.hash || "").toLowerCase();
      var target = "index.html";

      if (hash === "#images") target = "images.html";
      else if (hash === "#media" || hash === "#highlights") target = "media.html";
      else if (hash === "#biography" || hash === "#founder") target = "biography.html";
      else if (hash === "#cubecoin" || hash === "#components") target = "index.html#cubecoin";

      window.location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=index.html">
</head>
<body>
  <p>Redirecting to the updated page...</p>
</body>
</html>
