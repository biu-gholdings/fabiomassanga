    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{

      letter-spacing:-.01em;margin-bottom:16px;line-height:1.2;
    }
    p{color:var(--muted);font-size:16px;line-height:1.7;margin-bottom:34px;max-width:52ch}

    .lk:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 12px 28px rgba(168,134,42,.12)}
    .lk span{color:var(--gold-deep)}

    .home{
      display:inline-block;padding:14px 26px;background:var(--black);color:var(--paper);
      text-decoration:none;border-radius:8px;font-size:13px;font-weight:600;
      letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--black);
      transition:background .25s var(--ease),color .25s var(--ease);
    }
    .home:hover{background:transparent;color:var(--ink);border-color:var(--gold)}
    .home:focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px}

    .foot{
      border-top:1px solid var(--line);padding:24px 26px;text-align:center;
      color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    }

    @media (max-width:560px){ .links{grid-template-columns:1fr} }
    @media (prefers-reduced-motion:reduce){
